# Tema aplikasi. Empat warna induk: jingga #FF8000, tosca #40C0C0, abu #808080,
# putih #FFFFFF. Jingga dipakai Streamlit untuk tombol utama, fokus, dan slider;
# sisa tampilan diatur lewat GAYA pada lib/tampilan.py.
[theme]
base = "light"
primaryColor = "#FF8000"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F7"
textColor = "#2E3233"
font = "sans serif"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false
